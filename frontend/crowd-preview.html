<!doctype html>
<!--
  CROWD PREVIEW — dev only, never imported by the app.

  Renders N walking figures from one mesh and one vertex animation texture, and
  reports frame time. Crowd size is the question this page exists to answer:
  the texture costs the same for ten figures or ten thousand, so what is being
  chosen is vertex throughput and draw calls, not bytes.

    /crowd-preview.html?n=2000
-->
<html lang="en"><head><meta charset="utf-8"><title>Crowd preview</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:12px;z-index:2;font:12px/1.5 ui-monospace,monospace;
       color:#cfd6e4;background:rgba(8,10,16,.75);padding:10px 12px;border-radius:8px;white-space:pre}
</style></head><body>
<div id="hud">loading…</div><canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/examples/jsm/libs/meshopt_decoder.module.js";
import { loadCrowdAssets, buildCrowd } from "/src/world/crowd.js";

const q = new URLSearchParams(location.search);
const N = +(q.get("n") || 500);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = q.get("shadows") === "1";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2130);
scene.fog = new THREE.FogExp2(0x1a2130, 0.0035);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 900);
cam.position.set(0, 14, 62); cam.lookAt(0, 1, 0);
scene.add(new THREE.HemisphereLight(0x9ab6d8, 0x3a3a42, 2.2));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.position.set(60, 90, 40); scene.add(sun);
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x3b3f47, roughness: 1 })));

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const [gltf, vat] = await Promise.all([
  loader.loadAsync("/world/assets/crowd-figure.glb"),
  loadCrowdAssets(THREE),
]);
let geo = null, mat = null;
gltf.scene.traverse((o) => { if (o.isMesh && !geo) { geo = o.geometry; mat = o.material; } });

const places = [];
for (let i = 0; i < N; i += 1) {
  const a = Math.random() * Math.PI * 2, r = 4 + Math.sqrt(Math.random()) * 120;
  places.push({ p: [Math.cos(a) * r, 0, Math.sin(a) * r], ry: Math.random() * Math.PI * 2 });
}
const crowd = buildCrowd(THREE, geo, mat, vat, places);
scene.add(crowd.mesh);

const hud = document.getElementById("hud");
const clock = new THREE.Clock();
/*
 * FRAME INTERVAL, not time-around-render().
 *
 * gl.finish() did not force a real sync here: 15.6M triangles came back at
 * 0.35 ms, which would be 44 billion triangles a second. The honest measure of
 * "where does this stop being free" is the interval the browser can actually
 * sustain between frames, so this records rAF deltas and reports the MEDIAN —
 * a mean is dragged around by the first few frames while shaders compile.
 */
let last = performance.now();
const deltas = [];
renderer.setAnimationLoop(() => {
  const now = performance.now();
  deltas.push(now - last);
  last = now;
  crowd.advance(clock.getElapsedTime());
  renderer.render(scene, cam);
  if (deltas.length >= 120) {
    const sorted = deltas.slice(20).sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)];
    window.__crowd = { n: N, ms: +med.toFixed(2), fps: +(1000 / med).toFixed(1),
      calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
      verts: crowd.mesh.geometry.getAttribute("position").count };
    hud.textContent = `figures ${N}\nframe   ${med.toFixed(2)} ms (${(1000 / med).toFixed(0)} fps)\ncalls   ${renderer.info.render.calls}\ntris    ${renderer.info.render.triangles}`;
    deltas.length = 0;
  }
});
window.__crowdReady = true;
</script></body></html>
