<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Login world — WebGL prototype</title>
<style>
  html,body{margin:0;height:100%;background:#070a0e;overflow:hidden;
    font-family:ui-sans-serif,system-ui,sans-serif;color:#e6edf3}
  #gl{position:fixed;inset:0;display:block}
  /* The form is DOM, inside the scene's space: real inputs, real focus, real
     screen readers — the world behind it is the only thing that is WebGL. */
  #plate{position:fixed;left:8vw;top:50%;transform:translateY(-50%);
    width:330px;padding:26px 24px;border:1px solid rgba(160,190,220,.22);
    border-radius:3px;background:rgba(10,15,20,.55);backdrop-filter:blur(9px)}
  h1{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
  p.sub{margin:0 0 20px;font-size:12px;color:#8ea3b8;letter-spacing:.04em}
  label{display:block;font-size:10px;letter-spacing:.12em;color:#8ea3b8;margin:14px 0 6px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;background:rgba(255,255,255,.04);
    border:1px solid rgba(160,190,220,.24);border-radius:2px;color:#e6edf3;font-size:14px}
  input:focus{outline:none;border-color:#f0932f;background:rgba(240,147,47,.07)}
  button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:2px;
    background:#f0932f;color:#0b0f14;font-size:13px;font-weight:600;letter-spacing:.03em;cursor:pointer}
  #hud{position:fixed;right:10px;bottom:10px;font:11px ui-monospace,monospace;
    color:#7f94a8;background:rgba(0,0,0,.5);padding:7px 9px;border-radius:3px;white-space:pre}
</style></head><body>
<canvas id=gl></canvas>
<div id=plate>
  <h1>Construction Portal</h1>
  <p class=sub>SITE OPERATIONS · SIGN IN</p>
  <label for=e>EMAIL</label><input id=e type=email autocomplete=email>
  <label for=p>PASSWORD</label><input id=p type=password autocomplete=current-password>
  <button id=go>Sign in</button>
</div>
<div id=hud>starting…</div>
<script type="module">
import * as THREE from "three";
const SITE = await (await fetch("/src/world/siteGeometry.json")).json();
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOBILE = innerWidth < 700;

const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOBILE, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !MOBILE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;

const scene = new THREE.Scene();
// Depth fog is the cheapest and most convincing distance cue there is: it
// costs one uniform and does what a hundred opacity layers cannot.
scene.fog = new THREE.FogExp2(0x0a1017, MOBILE ? 0.0075 : 0.0056);
scene.background = new THREE.Color(0x080c11);

const cam = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 900);

/* ---- Materials: stylised cinematic realism, not photorealism ---------- */
const concrete = new THREE.MeshStandardMaterial({ color: 0x9aa6b2, roughness: 0.92, metalness: 0.02 });
const pour     = new THREE.MeshStandardMaterial({ color: 0x7d55ff, roughness: 0.7, metalness: 0.1,
                                                  emissive: 0x2a1170, emissiveIntensity: 0.5 });
const steel    = new THREE.MeshStandardMaterial({ color: 0xf0932f, roughness: 0.4, metalness: 0.55, emissive: 0x5a2f06, emissiveIntensity: 0.35 });
const tube     = new THREE.MeshStandardMaterial({ color: 0xb9c6d2, roughness: 0.6, metalness: 0.45 });
const dark     = new THREE.MeshStandardMaterial({ color: 0x39434e, roughness: 0.95 });
const far      = new THREE.MeshStandardMaterial({ color: 0x1b232c, roughness: 1 });

/* ---- Instanced geometry: one draw call per repeated kind -------------- */
const unit = new THREE.BoxGeometry(1, 1, 1);
function instance(list, mat, cast = true) {
  const m = new THREE.InstancedMesh(unit, mat, list.length);
  const o = new THREE.Object3D();
  list.forEach((b, i) => {
    o.position.set(b.p[0], b.p[1], b.p[2]);
    o.scale.set(b.s[0], b.s[1], b.s[2]);
    o.updateMatrix();
    m.setMatrixAt(i, o.matrix);
  });
  m.castShadow = cast && !MOBILE; m.receiveShadow = !MOBILE;
  scene.add(m);
  return m;
}

const F = SITE.frame;
instance(F.columns, concrete);
instance(F.slabs.filter(s => s.k === "slab"), concrete);
instance(F.slabs.filter(s => s.k === "slab-pour"), pour, false);
instance([F.core], concrete);
instance(SITE.massing, far, false);
instance(SITE.works, dark);
if (!MOBILE) {
  instance(SITE.scaffold.standards, tube);
  instance(SITE.scaffold.ledgers, tube, false);
  instance(SITE.scaffold.boards, dark, false);
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(SITE.ground, SITE.ground),
  new THREE.MeshStandardMaterial({ color: 0x11161c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = !MOBILE; scene.add(ground);

/* ---- The crane: an articulated rig, not a static model ---------------- */
const C = SITE.crane;
const rig = new THREE.Group();
rig.position.set(C.base[0], 0, C.base[2]);
const mast = new THREE.Mesh(new THREE.BoxGeometry(C.mast_w * 1.5, C.mast_h, C.mast_w * 1.5), steel);
mast.position.y = C.mast_h / 2; mast.castShadow = !MOBILE; rig.add(mast);

const slew = new THREE.Group();          // rotates: the whole jib assembly
slew.position.y = C.mast_h;
rig.add(slew);
const jib = new THREE.Mesh(new THREE.BoxGeometry(C.jib, 0.9, 0.9), steel);
jib.position.set(C.jib / 2, 1.1, 0); slew.add(jib);
const back = new THREE.Mesh(new THREE.BoxGeometry(C.back, 0.9, 0.9), steel);
back.position.set(-C.back / 2, 1.1, 0); slew.add(back);
const cwt = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.5, 2), dark);
cwt.position.set(-C.back, 1.1, 0); slew.add(cwt);

const trolley = new THREE.Group(); trolley.position.y = 1.1; slew.add(trolley);
const car = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.5, 0.9), steel); trolley.add(car);
const swing = new THREE.Group(); trolley.add(swing);          // hook sway pivots here
const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1, 5), tube);
swing.add(cable);
const load = new THREE.Mesh(new THREE.BoxGeometry(2, 1.1, 1.6), dark);
load.castShadow = !MOBILE; swing.add(load);
scene.add(rig);

/* ---- The hoist: a car on the frame's flank ---------------------------- */
const hoist = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.6, 2.0), steel);
hoist.position.set(F.grid.ox + F.grid.bays_x * F.grid.bay + 1.4, 4, F.grid.oz + 3);
hoist.castShadow = !MOBILE; scene.add(hoist);

/* ---- Lighting: one key, cool ambient distance, warm work lamps -------- */
const key = new THREE.DirectionalLight(0xbcd2ea, 2.1);
key.position.set(-60, 90, 50); key.castShadow = !MOBILE;
if (!MOBILE) {
  key.shadow.mapSize.set(1024, 1024);
  const c = key.shadow.camera; c.left = -70; c.right = 70; c.top = 70; c.bottom = -70; c.far = 260;
}
scene.add(key);
// A cool back light. Its only job is to put an edge on the steel so the crane
// separates from the sky — a silhouette is what makes machinery legible at
// distance, not more key light.
const rim = new THREE.DirectionalLight(0x86b4ff, 1.5);
rim.position.set(70, 40, -80);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x5b82b4, 0x11161d, 1.05));

const lamps = SITE.lights.map((l) => {
  const s = new THREE.SpotLight(l.warm ? 0xffb45c : 0x9fc4ff, l.warm ? 240 : 150,
                                90, Math.PI / 7, 0.55, 1.6);
  s.position.set(l.p[0], l.p[1], l.p[2]);
  s.target.position.set(l.aim[0], l.aim[1], l.aim[2]);
  scene.add(s); scene.add(s.target);
  return s;
});

/* ---- Camera choreography --------------------------------------------- */
const STA = SITE.cameras;
const v = (a) => new THREE.Vector3(a[0], a[1], a[2]);
let from = { pos: v(STA.approach.pos), look: v(STA.approach.look), fov: STA.approach.fov };
let to   = { pos: v(STA.station.pos),  look: v(STA.station.look),  fov: STA.station.fov };
let t0 = performance.now(), dur = 5200, curPos = from.pos.clone(), curLook = from.look.clone();

function fly(name, ms) {
  from = { pos: curPos.clone(), look: curLook.clone(), fov: cam.fov };
  const s = STA[name];
  to = { pos: v(s.pos), look: v(s.look), fov: s.fov };
  t0 = performance.now(); dur = ms;
}
document.getElementById("e").addEventListener("focus", () => fly("station", 1100));
document.getElementById("p").addEventListener("focus", () => fly("focus", 1100));
document.getElementById("go").addEventListener("click", (ev) => { ev.preventDefault(); fly("through", 1500); });

// Damped pointer camera offset: a target the camera chases, never a raw write.
let px = 0, py = 0, tx = 0, ty = 0;
if (!MOBILE) addEventListener("pointermove", (e) => {
  tx = (e.clientX / innerWidth - 0.5) * 2; ty = (e.clientY / innerHeight - 0.5) * 2;
}, { passive: true });

const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

let frames = 0, acc = 0, last = performance.now(), fps = 0, worst = 0;
const startedAt = performance.now();
let firstFrame = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const T = now / 1000;

  if (!REDUCED) {
    // Slew: a long, slow arc with holds at each end — a crane repositions,
    // it does not sweep like a metronome.
    slew.rotation.y = Math.sin(T / 29) * 0.42 + 0.5;
    // Trolley runs out, holds, runs back. Different period from the slew so
    // the two never fall into step.
    const u = (Math.sin(T / 19) + 1) / 2;
    trolley.position.x = C.trolley[0] + (C.trolley[1] - C.trolley[0]) * easeInOut(u);
    // The cable pays out and in; the load hangs on its end.
    const drop = C.hook_drop[0] + (C.hook_drop[1] - C.hook_drop[0]) * (Math.sin(T / 13) + 1) / 2;
    cable.scale.y = drop; cable.position.y = -drop / 2;
    load.position.y = -drop;
    // Sway lags the trolley's velocity: the load is being dragged, so it
    // trails, and the lag is what makes it read as mass.
    swing.rotation.z = Math.cos(T / 19) * 0.055;
    swing.rotation.x = Math.sin(T / 23) * 0.03;
    hoist.position.y = 4 + (Math.sin(T / 17) + 1) / 2 * (F.grid.storeys * F.grid.storey - 8);
    lamps.forEach((l, i) => { l.intensity = (i === lamps.length - 1 ? 150 : 240) * (0.93 + 0.07 * Math.sin(T * 0.7 + i)); });
    px += (tx - px) * 0.045; py += (ty - py) * 0.045;
  }

  const k = REDUCED ? 1 : Math.min(1, (now - t0) / dur);
  const e = easeInOut(k);
  curPos.lerpVectors(from.pos, to.pos, e);
  curLook.lerpVectors(from.look, to.look, e);
  cam.fov = from.fov + (to.fov - from.fov) * e;
  cam.position.copy(curPos).add(new THREE.Vector3(-px * 2.4, py * 1.3, 0));
  cam.lookAt(curLook);
  cam.updateProjectionMatrix();

  renderer.render(scene, cam);
  if (!firstFrame) firstFrame = now - startedAt;

  frames++; acc += dt;
  const ft = dt * 1000; if (ft > worst && frames > 40) worst = ft;
  if (acc >= 1) {
    fps = frames / acc; frames = 0; acc = 0;
    const info = renderer.info;
    document.getElementById("hud").textContent =
      `fps ${fps.toFixed(1)}  worst-frame ${worst.toFixed(1)}ms\n` +
      `draws ${info.render.calls}  tris ${info.render.triangles}\n` +
      `geom ${info.memory.geometries}  tex ${info.memory.textures}  firstFrame ${firstFrame.toFixed(0)}ms`;
    window.__m = { fps: +fps.toFixed(1), worst: +worst.toFixed(1), calls: info.render.calls,
                   tris: info.render.triangles, firstFrame: +firstFrame.toFixed(0) };
    worst = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
});
</script></body></html>
